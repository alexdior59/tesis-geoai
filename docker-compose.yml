services:
  geoai:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data/input:/geoai/data/input
      - ./data/results:/geoai/data/results
    environment:
      - PYTHONUNBUFFERED=1
      - GEOAI_DATA_DIR=/geoai/data/results
      - GEOAI_MAX_CONCURRENT_JOBS=1
    restart: unless-stopped